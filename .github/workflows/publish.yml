# Publishes to PyPI when a GitHub release is published, using PyPI trusted publishing (no token stored).
# One-time setup on pypi.org: project "elpriser" -> Publishing -> add a trusted publisher:
#   owner x2q, repository elpriser-python, workflow publish.yml, environment pypi.
# (For the very first release, add it as a *pending* publisher under Your account -> Publishing.)
name: Publish

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build twine
      - run: python -m build
      - run: twine check --strict dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  pypi:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
